---

- name: Configure the router r1
  hosts: r1
  become: true
  roles:
    - common
    - router
  vars:
    net1_ip: 10.0.10.1
    net1_subnet: 24
    net2_ip: 10.0.20.1
    net2_subnet: 24
    route_net: 10.0.30.0
    gateway: 10.0.20.2

- name: Configure the router r2
  hosts: r2
  become: true
  roles:
    - common
    - router
  vars:
    net1_ip: 10.0.30.1
    net1_subnet: 24
    net2_ip: 10.0.20.2
    net2_subnet: 24
    route_net: 10.0.10.0
    gateway: 10.0.20.1

- name: Configure the client
  hosts: c1
  become: true
  roles:
    - common
    - node
  vars:
    net_ip: 10.0.10.2
    net_subnet: 24
    route_net: 10.0.30.0
    gateway: 10.0.10.1

- name: Configure the server
  hosts: s1
  become: true
  roles:
    - common
    - node
  vars:
    net_ip: 10.0.30.2
    net_subnet: 24
    route_net: 10.0.10.0
    gateway: 10.0.30.1
